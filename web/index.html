<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#F6F6F4" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="文艺复兴" />
  <title>文艺复兴</title>
  <link rel="preload" as="image" href="./assets/avatar.jpg?v=3" />
  <link rel="icon" type="image/png" href="./assets/favicon.png?v=2" />
  <link rel="apple-touch-icon" href="./assets/avatar.jpg?v=3" />
  <link rel="stylesheet" href="./styles.css?v=14" />
</head>
<body>
  <div id="viewport-frame">
    <!-- Editorial Launch Splash: Museum-Framed Fresco -> Silky FLIP Morph to Top-Left Medallion -->
    <div id="splash-screen" class="splash-screen" aria-hidden="true">
      <div class="splash-veil"></div>
      <div class="splash-center">
        <div class="splash-frame">
          <span class="splash-mat-bg" aria-hidden="true"></span>
          <span class="splash-mat-inlay" aria-hidden="true"></span>
          <img id="splash-avatar" class="splash-avatar" src="./assets/avatar.jpg?v=3" alt="" width="184" height="184" decoding="sync" fetchpriority="high" />
        </div>
        <div class="splash-wordmark">
          <span class="splash-title">文艺复兴</span>
          <span class="splash-rule" aria-hidden="true"><span id="splash-progress" class="splash-rule-fill"></span></span>
          <span class="splash-latin">RENAISSANCE</span>
        </div>
      </div>
    </div>

    <!-- Tier 1: Editorial Warm-Paper Primary Mobile Surface -->
    <div id="app-shell" class="app-shell splash-pending">
      <header class="topbar">
        <div class="topbar-left">
          <img id="brand-avatar" class="brand-avatar" src="./assets/avatar.jpg?v=3" alt="文艺复兴" title="文艺复兴 · 今日概览" width="28" height="28" role="button" tabindex="0" aria-label="打开文艺复兴画框与今日市场概览" decoding="sync" />
          <button id="search-btn" class="topbar-search-btn" type="button" aria-label="查询股票或板块">
            <svg viewBox="0 0 16 16" width="13" height="13" fill="none" aria-hidden="true">
              <circle cx="7" cy="7" r="4.6" stroke="currentColor" stroke-width="1.5"/>
              <path d="M10.5 10.5L13.8 13.8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
            <span class="topbar-search-placeholder">搜股票 / 板块</span>
          </button>
        </div>

        <div class="date-stepper">
          <button id="date-latest" class="latest-btn hidden" type="button" aria-label="回到最新交易日">最新</button>
          <button id="date-prev" class="step-btn" type="button" aria-label="上一交易日">
            <svg viewBox="0 0 12 12" width="11" height="11" fill="none">
              <path d="M7.5 2.5L4 6L7.5 9.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
          <button id="date-btn" class="date-pill" type="button" aria-label="切换交易日">
            <span id="date-label">--.--</span>
            <svg class="chev" viewBox="0 0 12 12" width="10" height="10" fill="none">
              <path d="M3 4.5L6 7.5L9 4.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
          <button id="date-next" class="step-btn" type="button" aria-label="下一交易日">
            <svg viewBox="0 0 12 12" width="11" height="11" fill="none">
              <path d="M4.5 2.5L8 6L4.5 9.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
        </div>
      </header>
      <div id="day-loading-bar" class="day-loading-bar" aria-hidden="true"></div>

      <main id="main-layout" class="main-layout">
        <!-- Compact Single-Row Hot Sectors Entry + 3-Button Core Tools Strip -->
        <section class="hub-bar-wrap" aria-label="今日热点与核心工具">
          <div id="hub-bar" class="hub-bar"></div>
          <div id="home-tools" class="home-tools" aria-label="题材库、异动监控与并购重组"></div>
        </section>

        <!-- Primary Full-Height Consecutive-Board Ladder -->
        <section class="ladder-pane" aria-label="连板梯队">
          <div class="section-head ladder-head">
            <div class="ladder-title-group">
              <h2 class="section-title">连板梯队</h2>
              <button id="ladder-mode-btn" class="ladder-mode-btn" type="button" aria-pressed="false" title="切换量价PK视角（成交额 · 换手率）">量价</button>
            </div>
            <div id="ladder-focus-bar" class="ladder-focus-bar" aria-label="主线高亮筛选"></div>
          </div>
          <div id="ladder-scroll" class="ladder-scroll">
            <div id="ladder-list" class="ladder-list"></div>
          </div>
        </section>
      </main>
    </div>

    <!-- Tier 2: Editorial Bottom Sheet Modal (Hub / Search / Sector / Stock) -->
    <div id="sheet-backdrop" class="sheet-backdrop" aria-hidden="true"></div>
    <section id="sheet-container" class="sheet-container" role="dialog" aria-modal="true" aria-hidden="true">
      <div id="sheet-drag-zone" class="sheet-drag-zone">
        <div class="sheet-handle"></div>
      </div>
      <div id="sheet-header" class="sheet-header"></div>
      <div id="sheet-body" class="sheet-body"></div>
    </section>

    <!-- Compact Date Picker Sheet (Year + Month -> Trading Days) -->
    <div id="date-backdrop" class="sheet-backdrop date-backdrop" aria-hidden="true"></div>
    <section id="date-sheet" class="date-sheet" role="dialog" aria-modal="true" aria-hidden="true">
      <div class="sheet-drag-zone">
        <div class="sheet-handle"></div>
      </div>
      <div class="date-sheet-head">
        <div class="date-head-left">
          <span>交易日</span>
          <div id="date-year-tabs" class="date-year-tabs" role="tablist" aria-label="选择年份"></div>
        </div>
        <button id="date-close" class="sheet-close-btn" type="button" aria-label="关闭">×</button>
      </div>
      <div id="date-cycle-wrap" class="date-cycle-wrap" aria-label="近20日最高板情绪周期"></div>
      <div id="date-month-grid" class="date-month-grid" role="tablist" aria-label="选择月份"></div>
      <div id="date-list" class="date-list"></div>
    </section>
  </div>

  <script src="./app.js?v=16" defer></script>
</body>
</html>
